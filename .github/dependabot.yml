# Dependabot configuration for Bikontrol.
# Keeps NuGet, npm, GitHub Actions and Docker base images up to date and surfaces
# known vulnerabilities as security alerts/PRs.
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/Bikontrol"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/bikontrol-web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
