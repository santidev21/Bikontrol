name: E2E (Playwright)

# End-to-end tests of the critical user flow against the real stack
# (nginx + API + PostgreSQL). Complements the unit/integration suites: it drives
# the actual browser UI, so it catches wiring bugs the unit tests cannot (for
# example a client-side route that never matches).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: E2E critical flow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare CI environment
        run: |
          {
            echo "POSTGRES_DB=bikontrol_db"
            echo "POSTGRES_USER=bikontrol"
            echo "POSTGRES_PASSWORD=ci_dummy_password"
            echo "ConnectionStrings__DefaultConnection=Host=bikontrol-db;Port=5432;Database=bikontrol_db;Username=bikontrol;Password=ci_dummy_password;SslMode=Require;Trust Server Certificate=true"
            echo "Database__RunMigrationsOnStartup=true"
            echo "Jwt__Key=ci_dummy_key_0123456789abcdef0123456789abcdef"
            echo "Jwt__Issuer=BikontrolAPI"
            echo "Jwt__Audience=BikontrolClient"
            echo "Google__ClientId=ci.apps.googleusercontent.com"
            echo "Cors__AllowedOrigins=http://127.0.0.1:4300"
            echo "Frontend__BaseUrl=http://127.0.0.1:4300"
            # Registration must return a session directly: no mailbox in CI.
            echo "EmailConfirmation__Required=false"
            # The suite drives the real UI, so keep the demo tenant off.
            echo "Demo__Enabled=false"
          } > .env

      - name: Validate compose files
        run: >
          docker compose -f docker-compose.yml -f docker-compose.local.yml -f docker-compose.e2e.yml
          config --quiet

      - name: Start the stack
        run: >
          docker compose -f docker-compose.yml -f docker-compose.local.yml -f docker-compose.e2e.yml
          up -d --build

      - name: Wait for the frontend and API to be ready
        run: |
          for i in $(seq 1 60); do
            web=$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:4300/ || true)
            api=$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ready || true)
            echo "attempt $i: web=$web api=$api"
            if [ "$web" = "200" ] && [ "$api" = "200" ]; then
              echo "Stack is ready."
              exit 0
            fi
            sleep 5
          done
          echo "Stack did not become ready in time." >&2
          docker compose -f docker-compose.yml -f docker-compose.local.yml -f docker-compose.e2e.yml logs --tail=80
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Install Playwright browsers
        working-directory: e2e
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:4300
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

      - name: Stack logs (on failure)
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml -f docker-compose.e2e.yml logs --tail=120

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml -f docker-compose.e2e.yml down -v
