name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore backend
        run: dotnet restore Bikontrol/Bikontrol.sln

      - name: Verify formatting (dotnet format)
        run: dotnet format whitespace Bikontrol/Bikontrol.sln --verify-no-changes --no-restore

      - name: Run backend tests with coverage
        run: >
          dotnet test Bikontrol/Bikontrol.sln
          --no-restore
          --collect:"XPlat Code Coverage"
          --settings coverlet.runsettings
          --logger "trx;LogFileName=results.trx"

      - name: Check coverage threshold
        run: node scripts/check-coverage.mjs 80

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            **/TestResults/*.trx
            **/coverage.cobertura.xml
          retention-days: 7

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bikontrol-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: bikontrol-web
        run: npm ci --no-audit --no-fund

      - name: Lint (ESLint)
        working-directory: bikontrol-web
        run: npm run lint

      - name: Verify formatting (Prettier)
        working-directory: bikontrol-web
        run: npm run format:check

      - name: Run frontend tests with coverage
        working-directory: bikontrol-web
        run: npm run test:coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: bikontrol-web/coverage/
          retention-days: 7

      # The production build runs prebuild (scripts/set-env.js) and the AOT
      # compiler, which the unit tests do not. Build it here so a broken
      # environment generator or template fails CI instead of the deploy.
      - name: Build frontend (production)
        working-directory: bikontrol-web
        run: npm run build

  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy fs scan (deps, secrets, IaC)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true

  docker-compose-validate:
    name: Validate docker compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml -f docker-compose.local.yml config --quiet
          # The frontend container config carries the security headers/CSP; a
          # syntax error there would only surface at runtime, so check it here.
          docker run --rm -v "$PWD/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginxinc/nginx-unprivileged:1.31-alpine nginx -t
          # Monitoring stack: compose file, Prometheus rules/config and the
          # Alertmanager routing must parse, or the alerts silently never fire.
          docker compose -f docker-compose.monitoring.yml config --quiet
          docker run --rm --entrypoint promtool -v "$PWD/deploy/monitoring:/etc/prometheus:ro" \
            prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint amtool -v "$PWD/deploy/monitoring:/m:ro" \
            -e ALERT_SMTP_HOST=smtp.example -e ALERT_SMTP_PORT=587 -e ALERT_SMTP_USER=u \
            -e ALERT_SMTP_PASSWORD=p -e ALERT_EMAIL_FROM=a@example.com -e ALERT_EMAIL_TO=b@example.com \
            prom/alertmanager:v0.34.2@sha256:39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b \
            check-config --alertmanager.config.expand-envvars /m/alertmanager.yml
        env:
          POSTGRES_DB: bikontrol_db
          POSTGRES_USER: bikontrol
          POSTGRES_PASSWORD: ci_dummy_password
          ConnectionStrings__DefaultConnection: Host=bikontrol-db;Port=5432;Database=bikontrol_db;Username=bikontrol;Password=ci_dummy_password
          Jwt__Key: ci_dummy_key_0123456789abcdef0123456789abcdef
          Smtp__Host: smtp.example
          Smtp__FromEmail: a@example.com
          ALERT_EMAIL_TO: b@example.com
          GRAFANA_ADMIN_PASSWORD: ci_dummy_password

  dependency-audit:
    name: Dependency vulnerability report (non-blocking)
    runs-on: ubuntu-latest
    # Report only: the remaining framework advisories require a major upgrade
    # (tracked separately) and the AutoMapper 12 advisory is consciously
    # suppressed, so this must not block the pipeline.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: .NET vulnerable packages
        continue-on-error: true
        run: dotnet list Bikontrol/Bikontrol.sln package --vulnerable --include-transitive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bikontrol-web/package-lock.json

      - name: npm audit (production dependencies)
        continue-on-error: true
        working-directory: bikontrol-web
        run: npm audit --omit=dev --audit-level=high

  # Build each image exactly once, scan the result, then publish it with an
  # immutable `sha-<commit>` tag. The deploy pulls these tags and never builds on
  # the server, so what was tested and scanned is what runs, and a rollback is
  # just "run the previous tag".
  publish-images:
    name: Build, scan and publish images
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, secret-scan, trivy, docker-compose-validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      api_image: ${{ steps.vars.outputs.api_image }}
      web_image: ${{ steps.vars.outputs.web_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image names and tag
        id: vars
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "api_image=ghcr.io/${owner}/bikontrol-api" >> "$GITHUB_OUTPUT"
          echo "web_image=ghcr.io/${owner}/bikontrol-web" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile.api
          load: true
          tags: ${{ steps.vars.outputs.api_image }}:${{ steps.vars.outputs.tag }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile.web
          load: true
          build-args: |
            GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
          tags: ${{ steps.vars.outputs.web_image }}:${{ steps.vars.outputs.tag }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Trivy scan (API image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.vars.outputs.api_image }}:${{ steps.vars.outputs.tag }}
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true

      - name: Trivy scan (web image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.vars.outputs.web_image }}:${{ steps.vars.outputs.tag }}
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true

      - name: Push images
        run: |
          docker push "${{ steps.vars.outputs.api_image }}:${{ steps.vars.outputs.tag }}"
          docker push "${{ steps.vars.outputs.web_image }}:${{ steps.vars.outputs.tag }}"

  # `main` is protected: the CodeQL, SonarCloud and E2E workflows are required
  # status checks on the PR, so only commits that passed them reach this job.
  # The `production` environment adds a manual approval (Settings -> Environments
  # -> production -> Required reviewers).
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [publish-images]
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy ${{ needs.publish-images.outputs.tag }} via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_TAG: ${{ needs.publish-images.outputs.tag }}
          API_IMAGE: ${{ needs.publish-images.outputs.api_image }}
          WEB_IMAGE: ${{ needs.publish-images.outputs.web_image }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG,API_IMAGE,WEB_IMAGE,REGISTRY_USER,REGISTRY_TOKEN
          script: |
            cd /opt/bikontrol
            ./scripts/deploy.sh deploy "$IMAGE_TAG"
