name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore backend
        run: dotnet restore Bikontrol/Bikontrol.sln

      - name: Verify formatting (dotnet format)
        run: dotnet format whitespace Bikontrol/Bikontrol.sln --verify-no-changes --no-restore

      - name: Run backend tests with coverage
        run: >
          dotnet test Bikontrol/Bikontrol.sln
          --no-restore
          --collect:"XPlat Code Coverage"
          --settings coverlet.runsettings
          --logger "trx;LogFileName=results.trx"

      - name: Check coverage threshold
        run: node scripts/check-coverage.mjs 80

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            **/TestResults/*.trx
            **/coverage.cobertura.xml
          retention-days: 7

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bikontrol-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: bikontrol-web
        run: npm ci --no-audit --no-fund

      - name: Lint (ESLint)
        working-directory: bikontrol-web
        run: npm run lint

      - name: Verify formatting (Prettier)
        working-directory: bikontrol-web
        run: npm run format:check

      - name: Run frontend tests
        working-directory: bikontrol-web
        run: npm test

  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy fs scan (deps, secrets, IaC)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true

  docker-compose-validate:
    name: Validate docker compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml -f docker-compose.local.yml config --quiet
        env:
          POSTGRES_DB: bikontrol_db
          POSTGRES_USER: bikontrol
          POSTGRES_PASSWORD: ci_dummy_password
          ConnectionStrings__DefaultConnection: Host=bikontrol-db;Port=5432;Database=bikontrol_db;Username=bikontrol;Password=ci_dummy_password
          Jwt__Key: ci_dummy_key_0123456789abcdef0123456789abcdef

  dependency-audit:
    name: Dependency vulnerability report (non-blocking)
    runs-on: ubuntu-latest
    # Report only: the remaining framework advisories require a major upgrade
    # (tracked separately) and the AutoMapper 12 advisory is consciously
    # suppressed, so this must not block the pipeline.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: .NET vulnerable packages
        continue-on-error: true
        run: dotnet list Bikontrol/Bikontrol.sln package --vulnerable --include-transitive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bikontrol-web/package-lock.json

      - name: npm audit (production dependencies)
        continue-on-error: true
        working-directory: bikontrol-web
        run: npm audit --omit=dev --audit-level=high

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, docker-compose-validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            cd /opt/bikontrol
            ./scripts/deploy.sh deploy
