name: Mutation testing

# Stryker.NET on the pieces of logic that matter most:
# - MaintenanceScheduleCalculator (Application): the shared countdown behind the
#   dashboard and the reminders, tested with in-memory fakes.
# - FuelConsumptionCalculator (Application): consumption (km/l), cost per km and
#   the consumption-drop signal.
# - MaintenanceService (Infrastructure): the CRUD/ownership/record write paths.
# All run without PostgreSQL, so the jobs are fast.
#
# Runs when the mutated code, its tests or the configs change; weekly on a
# schedule; and on demand. Each job fails when its mutation score drops below the
# `break` threshold in its config.
on:
  pull_request:
    branches: [main]
    paths:
      - 'Bikontrol/Bikontrol.Application/Services/MaintenanceScheduleCalculator.cs'
      - 'Bikontrol/Bikontrol.Application/Services/FuelConsumptionCalculator.cs'
      - 'Bikontrol/Bikontrol.Application/Services/MaintenanceService.cs'
      - 'Bikontrol/Bikontrol.Tests/MaintenanceService*'
      - 'Bikontrol/Bikontrol.Tests/ReminderServiceTests.cs'
      - 'Bikontrol/Bikontrol.Tests/FuelConsumptionCalculatorTests.cs'
      - 'stryker-config.json'
      - 'stryker-fuel-consumption.json'
      - 'stryker-maintenance-service.json'
      - '.github/workflows/mutation.yml'
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stryker:
    name: Stryker.NET (${{ matrix.target.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: MaintenanceScheduleCalculator
            config: stryker-config.json
          - name: FuelConsumptionCalculator
            config: stryker-fuel-consumption.json
          - name: MaintenanceService
            config: stryker-maintenance-service.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Stryker.NET
        # Pinned: keep the tool line in step with the SDK line. 5.0.0 ships a
        # net10.0 tool, matching the .NET 10 SDK used by this workflow.
        run: dotnet tool install --global dotnet-stryker --version 5.0.0

      - name: Restore
        run: dotnet restore Bikontrol/Bikontrol.sln

      - name: Run mutation tests
        run: dotnet stryker --config-file ${{ matrix.target.config }}

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ matrix.target.name }}
          path: StrykerOutput/**/reports/
