services:
  db:
    image: postgres:16-alpine
    container_name: bikontrol-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - bikontrol_db_data:/var/lib/postgresql/data
      - ./docker/db/init-ssl.sh:/usr/local/bin/init-ssl.sh:ro
    entrypoint: ["sh", "/usr/local/bin/init-ssl.sh"]
    networks:
      - bikontrol-internal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: bikontrol-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}
      # In production, deploy.sh applies migrations as a dedicated step
      # (`deploy.sh migrate`) and .env sets this to false. The default stays
      # true so local/Docker dev and CI (which do not run deploy.sh) still get
      # their schema created on startup.
      Database__RunMigrationsOnStartup: ${Database__RunMigrationsOnStartup:-true}
      Jwt__Key: ${Jwt__Key}
      Jwt__Issuer: ${Jwt__Issuer:-BikontrolAPI}
      Jwt__Audience: ${Jwt__Audience:-BikontrolClient}
      Jwt__ExpireMinutes: ${Jwt__ExpireMinutes:-15}
      Jwt__RefreshExpireDays: ${Jwt__RefreshExpireDays:-30}
      Google__ClientId: ${Google__ClientId:-}
      Frontend__BaseUrl: ${Frontend__BaseUrl:-https://bikontrol.santidev21.tech}
      Smtp__Host: ${Smtp__Host:-}
      Smtp__Port: ${Smtp__Port:-587}
      Smtp__Username: ${Smtp__Username:-}
      Smtp__Password: ${Smtp__Password:-}
      Smtp__FromEmail: ${Smtp__FromEmail:-}
      Smtp__FromName: ${Smtp__FromName:-Bikontrol}
      Smtp__EnableSsl: ${Smtp__EnableSsl:-true}
      Cors__AllowedOrigins: ${Cors__AllowedOrigins:-https://bikontrol.santidev21.tech,http://127.0.0.1:4200,http://127.0.0.1:4201}
      # Public demo tenant: off by default. Turn it on deliberately (and only
      # for a controlled demo) with Demo__Enabled=true.
      Demo__Enabled: ${Demo__Enabled:-false}
      # Require email confirmation before login (default true).
      EmailConfirmation__Required: ${EmailConfirmation__Required:-true}
      # Account lockout after repeated failed logins (defaults: on, 5, 15 min).
      Lockout__Enabled: ${Lockout__Enabled:-true}
      Lockout__MaxFailedAttempts: ${Lockout__MaxFailedAttempts:-5}
      Lockout__Minutes: ${Lockout__Minutes:-15}
      # Error tracking (Sentry). Empty DSN = disabled (no-op).
      Sentry__Dsn: ${Sentry__Dsn:-}
      Sentry__TracesSampleRate: ${Sentry__TracesSampleRate:-0.1}
      # Prometheus metrics at /metrics (internal network only; never proxied by
      # the public gateway). Off unless explicitly enabled.
      Metrics__Enabled: ${Metrics__Enabled:-true}
      # Maintenance reminders engine (daily job + dedupe window).
      Reminders__Enabled: ${Reminders__Enabled:-true}
      Reminders__EmailEnabled: ${Reminders__EmailEnabled:-true}
      Reminders__PushEnabled: ${Reminders__PushEnabled:-true}
      Reminders__DailyHourUtc: ${Reminders__DailyHourUtc:-8}
      Reminders__DedupeDays: ${Reminders__DedupeDays:-3}
      # Web Push (VAPID). Empty keys = push is a no-op.
      WebPush__PublicKey: ${WebPush__PublicKey:-}
      WebPush__PrivateKey: ${WebPush__PrivateKey:-}
      WebPush__Subject: ${WebPush__Subject:-mailto:contacto.santidev21@gmail.com}
    networks:
      - bikontrol-net
      - bikontrol-internal-net
    healthcheck:
      # /ready also checks PostgreSQL (see Dockerfile.api / Program.cs).
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        # Public Google OAuth client id, baked into the bundle. Sourced from the
        # deploy .env (Google__ClientId); empty disables the Google button.
        GOOGLE_CLIENT_ID: ${Google__ClientId:-}
    container_name: bikontrol
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - bikontrol-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M

networks:
  bikontrol-net:
    name: bikontrol-net
    external: true
  bikontrol-internal-net:
    name: bikontrol-internal-net

volumes:
  bikontrol_db_data:
