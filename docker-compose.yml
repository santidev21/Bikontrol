services:
  db:
    image: postgres:16-alpine
    container_name: bikontrol-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - bikontrol_db_data:/var/lib/postgresql/data
    networks:
      - bikontrol-internal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: bikontrol-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}
      Jwt__Key: ${Jwt__Key}
      Jwt__Issuer: ${Jwt__Issuer:-BikontrolAPI}
      Jwt__Audience: ${Jwt__Audience:-BikontrolClient}
      Cors__AllowedOrigins: ${Cors__AllowedOrigins:-https://bikontrol.santidev21.tech}
    networks:
      - bikontrol-net
      - bikontrol-internal-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: bikontrol
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - bikontrol-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M

networks:
  bikontrol-net:
    name: bikontrol-net
    external: true
  bikontrol-internal-net:
    name: bikontrol-internal-net

volumes:
  bikontrol_db_data:
