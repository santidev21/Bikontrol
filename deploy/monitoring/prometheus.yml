# Prometheus scrape configuration for Bikontrol.
#
# The API and the worker expose OpenTelemetry metrics in Prometheus format at
# /metrics when `Metrics__Enabled=true`. They are only reachable from inside the
# Docker network (`bikontrol-internal-net`) — the public gateway never proxies
# them. Run the whole stack with `docker-compose.monitoring.yml`.

global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: bikontrol-api
    metrics_path: /metrics
    static_configs:
      # The API container is on the internal network under this name.
      - targets: ['bikontrol-api:8080']

  # The worker owns the daily jobs (reminders, retention), so their metrics
  # (bikontrol_job_*) only exist here. It has no fixed container name: use the
  # compose service name.
  - job_name: bikontrol-worker
    metrics_path: /metrics
    static_configs:
      - targets: ['worker:8080']
