# Alert rules for the Bikontrol API. Pair these with an Alertmanager (or have
# Prometheus forward to email/Slack) so they actually notify someone.
groups:
  - name: bikontrol-availability
    rules:
      # The API stopped responding to scrapes (container down, crash loop, or
      # hung). This complements the external uptime check on /ready.
      - alert: BikontrolApiDown
        expr: up{job="bikontrol-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'Bikontrol API is not responding to Prometheus scrapes'
          description: 'up == 0 for more than 2 minutes. Check the api container and /ready.'

      # PostgreSQL stopped responding to the readiness probe.
      - alert: BikontrolDatabaseUnreachable
        expr: up{job="bikontrol-api"} == 0 or probe_success{job="bikontrol-ready"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'Bikontrol database is unreachable'
          description: 'The /ready readiness probe is failing; requests would fail.'

  - name: bikontrol-errors
    rules:
      # Server errors over the last 5 minutes, as a share of all requests.
      - alert: BikontrolHigh5xxRate
        expr: |
          sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m]))
          /
          sum(rate(http_server_request_duration_seconds_count[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Bikontrol API 5xx rate above 5%'
          description: 'More than 5% of requests have returned 5xx for 10 minutes.'

      # p95 latency creeping up.
      - alert: BikontrolHighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(http_server_request_duration_seconds_bucket[5m])) by (le)
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Bikontrol API p95 latency above 1s'
          description: 'The 95th percentile request duration has been over 1s for 10 minutes.'

  - name: bikontrol-resources
    rules:
      # Process working set creeping toward the 512 MB container limit (possible
      # leak, and the usual precursor of an OOM kill). Applies to the API and the
      # worker. The runtime metrics were renamed to dotnet_* by OpenTelemetry
      # runtime instrumentation >= 1.10.
      - alert: BikontrolHighMemory
        expr: dotnet_process_memory_working_set_bytes > 400 * 1024 * 1024
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Bikontrol {{ $labels.job }} memory above 400 MB'
          description: 'The {{ $labels.job }} process working set has exceeded 400 MB for 15 minutes (container limit: 512 MB).'

  - name: bikontrol-jobs
    rules:
      # The worker owns the daily jobs; without it no reminder is ever sent.
      - alert: BikontrolWorkerDown
        expr: up{job="bikontrol-worker"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'Bikontrol worker is not responding to Prometheus scrapes'
          description: 'The daily jobs (reminders, retention) are not running. Check the worker container.'

      # A failed run retries on every 15-minute tick, so two failures in an hour
      # means it keeps failing, not a blip.
      - alert: BikontrolJobFailing
        expr: sum by (task) (increase(bikontrol_job_runs_total{result="failed"}[1h])) >= 2
        labels:
          severity: warning
        annotations:
          summary: 'Background job {{ $labels.task }} keeps failing'
          description: 'The {{ $labels.task }} job failed at least twice in the last hour. See the worker logs ("Reminder run failed" / "Retention run failed").'

      # Jobs run once a day. The series only exists after the first success since
      # the worker started, so this catches "ran fine yesterday, silent since".
      - alert: BikontrolJobStale
        expr: time() - max by (task) (bikontrol_job_last_success_timestamp_seconds) > 26 * 3600
        labels:
          severity: warning
        annotations:
          summary: 'Background job {{ $labels.task }} has not succeeded for over 26 hours'
          description: 'Check the worker logs and the advisory lock (another instance may be holding it).'

