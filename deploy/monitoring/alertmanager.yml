# Alertmanager routing for Bikontrol. Started with --config.expand-envvars, so the
# ALERT_* values come from the container environment (see
# docker-compose.monitoring.yml) and no secret lives in the repo.
global:
  smtp_smarthost: '${ALERT_SMTP_HOST}:${ALERT_SMTP_PORT}'
  smtp_from: '${ALERT_EMAIL_FROM}'
  smtp_auth_username: '${ALERT_SMTP_USER}'
  smtp_auth_password: '${ALERT_SMTP_PASSWORD}'
  smtp_require_tls: true

route:
  receiver: email
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  # Re-notify while an alert keeps firing, so a missed email is not the end of it.
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      receiver: email
      repeat_interval: 1h

receivers:
  - name: email
    email_configs:
      - to: '${ALERT_EMAIL_TO}'
        send_resolved: true

# A critical alert already says everything its warning-level sibling would.
inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: ['alertname']
