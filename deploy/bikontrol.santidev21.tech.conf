# ── BIKONTROL — bikontrol.santidev21.tech ─────────────────────────
# Copy this file into the vps-gateway repo at sites-enabled/ and
# issue the certificate FIRST (see vps-gateway/AGENTS.md).

# HTTP: ACME challenge + redirect to HTTPS
server {
    listen 8080;
    server_name bikontrol.santidev21.tech;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: terminates TLS and routes to backend or frontend.
server {
    listen 8443 ssl;
    http2 on;
    server_name bikontrol.santidev21.tech;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/bikontrol.santidev21.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bikontrol.santidev21.tech/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # Security headers
    include /etc/nginx/snippets/security-headers.conf;

    # Re-resolved by the Docker embedded DNS (resolver in nginx.conf).
    set $backend_upstream  bikontrol-api:8080;
    set $frontend_upstream bikontrol:80;

    # -------------------------------------------------
    # Health checks — must NOT fall through to the SPA.
    # -------------------------------------------------
    location ~ ^/health(/.*)?$ {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # -------------------------------------------------
    # API auth — strict rate limit
    # -------------------------------------------------
    location /api/auth/ {
        limit_req zone=auth burst=50 nodelay;
        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # -------------------------------------------------
    # API routes
    # -------------------------------------------------
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # -------------------------------------------------
    # Static assets — long cache
    # -------------------------------------------------
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|woff2?|eot|ttf|svg|otf)$ {
        proxy_pass http://$frontend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # -------------------------------------------------
    # Angular SPA catch-all
    # -------------------------------------------------
    location / {
        limit_req zone=general burst=50 nodelay;
        proxy_pass http://$frontend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
