<div class="flex items-center justify-center min-h-screen bg-bg px-4">
  <div class="w-full max-w-sm p-6 bg-card rounded-2xl shadow-lg">
    <img src="logo.webp" alt="Bikontrol logo" class="mx-auto mb-4 w-24 h-24">

    <h1 class="text-2xl font-bold text-center mb-6 text-primary">Nueva contraseña</h1>

    <small *ngIf="linkInvalid" class="text-red-500 text-xs block text-center mb-4 font-bold">
      El enlace de recuperación es inválido o está incompleto. Solicita uno nuevo.
    </small>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="mb-4">
        <label for="reset-password" class="block text-sm font-medium text-textdark mb-1">Nueva contraseña</label>
        <input
          id="reset-password"
          type="password"
          formControlName="newPassword"
          class="w-full px-4 py-2 border border-accent rounded-lg focus:ring-2 focus:ring-secondary focus:outline-none"
          placeholder="••••••••"
        />
        <small *ngIf="isInvalid('newPassword') && f['newPassword'].errors?.['required']" class="text-red-500 text-xs font-bold">
          La contraseña es obligatoria.
        </small>
        <small *ngIf="isInvalid('newPassword') && f['newPassword'].errors?.['minlength']" class="text-red-500 text-xs font-bold">
          Debe tener al menos 6 caracteres.
        </small>
      </div>

      <div class="mb-6">
        <label for="reset-confirm" class="block text-sm font-medium text-textdark mb-1">Confirmar contraseña</label>
        <input
          id="reset-confirm"
          type="password"
          formControlName="confirmPassword"
          class="w-full px-4 py-2 border border-accent rounded-lg focus:ring-2 focus:ring-secondary focus:outline-none"
          placeholder="••••••••"
        />
        <small *ngIf="isInvalid('confirmPassword') && f['confirmPassword'].errors?.['required']" class="text-red-500 text-xs font-bold">
          Debes confirmar la contraseña.
        </small>
        <small *ngIf="form.errors?.['passwordMismatch'] && (f['confirmPassword'].dirty || f['confirmPassword'].touched)" class="text-red-500 text-xs font-bold">
          Las contraseñas no coinciden.
        </small>
      </div>

      <button
        type="submit"
        [disabled]="form.invalid || linkInvalid"
        class="w-full py-2 bg-primary text-textlight rounded-lg hover:bg-accent transition-colors disabled:bg-accent disabled:cursor-not-allowed"
      >
        Restablecer contraseña
      </button>

      <small *ngIf="successMessage" class="text-green-600 text-xs block text-center mt-3 font-bold">
        {{ successMessage }}
      </small>
      <small *ngIf="errorMessage" class="text-red-500 text-xs block text-center mt-3 font-bold">
        {{ errorMessage }}
      </small>
    </form>
  </div>
</div>
