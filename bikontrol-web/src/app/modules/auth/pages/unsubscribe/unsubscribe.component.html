<div class="flex items-center justify-center min-h-screen bg-bg px-4">
  <div class="w-full max-w-sm p-6 bg-card rounded-2xl shadow-lg text-center">
    <img src="logo.webp" alt="Bikontrol logo" class="mx-auto mb-4 w-24 h-24" />

    <h1 class="text-2xl font-bold mb-4 text-primary">{{ 'auth.unsubscribe.title' | t }}</h1>

    @if (!hasToken) {
      <small class="text-red-500 text-xs block mb-6 font-bold">{{
        'auth.unsubscribe.linkInvalid' | t
      }}</small>
    } @else if (state() === 'done') {
      <small class="text-green-600 text-xs block mb-6 font-bold">{{
        'auth.unsubscribe.success' | t
      }}</small>
    } @else {
      <p class="text-sm text-textdark mb-6">{{ 'auth.unsubscribe.description' | t }}</p>

      @if (state() === 'error') {
        <small class="text-red-500 text-xs block mb-4 font-bold">{{ errorMessage() }}</small>
      }

      <button
        type="button"
        (click)="confirm()"
        [disabled]="state() === 'loading'"
        class="w-full py-2 mb-3 bg-primary text-textlight rounded-lg hover:bg-accent transition-colors disabled:opacity-60"
      >
        @if (state() === 'loading') {
          <app-spinner size="sm"></app-spinner>
        } @else {
          {{ 'auth.unsubscribe.confirm' | t }}
        }
      </button>
    }

    <button
      type="button"
      routerLink="/login"
      class="w-full py-2 text-primary rounded-lg hover:underline"
    >
      {{ 'auth.unsubscribe.goToApp' | t }}
    </button>
  </div>
</div>
