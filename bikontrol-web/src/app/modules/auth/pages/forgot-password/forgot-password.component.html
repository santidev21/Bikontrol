<div class="flex items-center justify-center min-h-screen bg-bg px-4">
  <div class="w-full max-w-sm p-6 bg-card rounded-2xl shadow-lg">
    <img src="logo.webp" alt="Bikontrol logo" class="mx-auto mb-4 w-24 h-24">

    <h1 class="text-2xl font-bold text-center mb-2 text-primary">Recuperar contraseña</h1>
    <p class="text-sm text-textdark text-center mb-6">
      Ingresa tu correo y te enviaremos un enlace para restablecer tu contraseña.
    </p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="mb-4">
        <label class="block text-sm font-medium text-textdark mb-1">Correo</label>
        <input
          type="email"
          formControlName="email"
          class="w-full px-4 py-2 border border-accent rounded-lg focus:ring-2 focus:ring-secondary focus:outline-none"
          placeholder="correo@example.com"
        />
        <small *ngIf="isInvalid('email') && f['email'].errors?.['required']" class="text-red-500 text-xs font-bold">
          El correo es obligatorio.
        </small>
        <small *ngIf="isInvalid('email') && f['email'].errors?.['email']" class="text-red-500 text-xs font-bold">
          Ingresa un correo válido.
        </small>
      </div>

      <button
        type="submit"
        [disabled]="form.invalid"
        class="w-full py-2 bg-primary text-textlight rounded-lg hover:bg-accent transition-colors disabled:bg-accent disabled:cursor-not-allowed"
      >
        Enviar enlace
      </button>

      <small *ngIf="successMessage" class="text-green-600 text-xs block text-center mt-3 font-bold">
        {{ successMessage }}
      </small>
      <small *ngIf="errorMessage" class="text-red-500 text-xs block text-center mt-3 font-bold">
        {{ errorMessage }}
      </small>

      <button
        type="button"
        routerLink="/login"
        class="w-full mt-6 py-2 bg-primary text-textlight rounded-lg hover:bg-accent transition-colors"
      >
        Volver al inicio de sesión
      </button>
    </form>
  </div>
</div>
