<div class="p-4 max-w-2xl mx-auto">
  <h1 class="text-2xl font-bold text-white mb-4">Registrar mantenimiento</h1>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="bg-gray-800 rounded-xl p-4 space-y-4">
    <div>
      <label class="block text-sm text-gray-300 mb-1">Mantenimiento</label>
      <select formControlName="userMaintenanceId" class="w-full rounded-lg p-2 bg-gray-900 text-white border border-gray-700">
        <option value="">Selecciona un mantenimiento</option>
        <option *ngFor="let maintenance of maintenances" [value]="maintenance.id">
          {{ maintenance.name }} ({{ maintenance.trackingType }})
        </option>
      </select>
    </div>

    <div>
      <label class="block text-sm text-gray-300 mb-1">Fecha</label>
      <input type="date" formControlName="performedAt" class="w-full rounded-lg p-2 bg-gray-900 text-white border border-gray-700" />
    </div>

    <div *ngIf="selectedMaintenance?.trackingType === 'Km'">
      <label class="block text-sm text-gray-300 mb-1">Kilometraje</label>
      <input type="number" formControlName="performedKm" class="w-full rounded-lg p-2 bg-gray-900 text-white border border-gray-700" />
      <p class="text-xs text-gray-400 mt-1">Km actual: {{ currentKm }} | Último de este mantenimiento: {{ lastMaintenanceKm ?? 'Sin registro' }}</p>
    </div>

    <button
      type="submit"
      [disabled]="isSubmitting"
      class="w-full mt-2 py-2 bg-primary text-textlight rounded-lg hover:bg-accent transition-colors font-semibold disabled:opacity-60">
      {{ isSubmitting ? 'Guardando...' : 'Registrar mantenimiento' }}
    </button>
  </form>
</div>
