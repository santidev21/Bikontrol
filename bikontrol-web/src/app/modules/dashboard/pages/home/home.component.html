<div class="p-4">
  <h1 class="text-2xl font-bold mb-2 text-center">{{ 'home.welcome' | t }}</h1>
  <p class="text-gray-400 mb-4 text-center">{{ 'home.subtitle' | t }}</p>

  @if (motorcycles.value().length === 0) {
    <div class="bg-card rounded-xl p-6 mt-6 text-center">
      <h2 class="text-lg font-bold text-primary mb-2">{{ 'home.emptyTitle' | t }}</h2>
      <p class="text-sm text-textdark mb-4">{{ 'home.emptyText' | t }}</p>
      @if (!isDemo) {
        <button
          routerLink="/dashboard/onboarding"
          class="w-full py-2 bg-primary text-textlight rounded-lg hover:bg-accent transition-colors font-semibold"
        >
          {{ 'home.start' | t }}
        </button>
      }
    </div>
  }

  @if (motorcycles.value().length > 0) {
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      @for (moto of motorcycles.value(); track moto.id) {
        <app-motorcycle-card [motorcycle]="moto" (deleted)="motorcycles.reload()">
        </app-motorcycle-card>
      }
    </div>
  }

  @if (!isDemo) {
    <div class="mt-6 text-center">
      <button
        routerLink="/dashboard/motorcycles/add"
        class="w-full mt-6 py-2 bg-primary text-textlight rounded-lg hover:bg-accent transition-colors"
      >
        {{ 'home.addMotorcycle' | t }}
      </button>
    </div>
  }
</div>
