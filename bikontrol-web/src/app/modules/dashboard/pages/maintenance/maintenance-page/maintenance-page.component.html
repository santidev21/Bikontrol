<div class="p-4">
  <h1 class="text-2xl font-bold mb-2 text-center">{{ 'maint.title' | t }}</h1>

  @if (!isDemo()) {
    <div class="text-center">
      <button
        (click)="goToAddMaintenance()"
        class="w-full mt-6 py-2 bg-primary text-textlight rounded-lg hover:bg-accent transition-colors"
      >
        {{ 'maint.addCustom' | t }}
      </button>
    </div>
  }

  <div class="mt-6">
    <p class="text-gray-400 mb-4 text-center">{{ 'maint.mine' | t }}</p>

    @for (item of userMaintenance(); track item) {
      <app-maintenance-info-card
        [maintenance]="item"
        [motorcycleIdContext]="motorcycleId()"
        (refresh)="reload()"
        [isDefault]="false"
      >
      </app-maintenance-info-card>
    }
  </div>

  <!-- Divider -->
  <div class="border-b border-gray-700 my-6"></div>

  <div>
    <p class="text-gray-400 mb-4 text-center">{{ 'maint.defaults' | t }}</p>

    @for (item of defaultMaintenance(); track item) {
      <app-maintenance-info-card
        [maintenance]="item"
        [motorcycleIdContext]="motorcycleId()"
        (refresh)="reload()"
        [isDefault]="true"
      >
      </app-maintenance-info-card>
    }
  </div>
</div>
